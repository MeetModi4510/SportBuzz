services:
  - type: web
    name: sportbuzz-backend
    runtime: python  # We use a custom build so we can mix Node + Python
    plan: free
    rootDir: server
    buildCommand: |
      # Install Node.js
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # Install Chrome + Xvfb for headless scraping
      apt-get install -y wget gnupg xvfb
      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
      apt-get update
      apt-get install -y google-chrome-stable

      # Install Python dependencies
      pip3 install undetected-chromedriver beautifulsoup4 lxml psutil

      # Install Node dependencies
      npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISPLAY
        value: ":99"
